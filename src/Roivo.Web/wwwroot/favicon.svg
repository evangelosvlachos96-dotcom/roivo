<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Roivo">
  <defs>
    <linearGradient id="roivoMark" x1="0" y1="32" x2="32" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2DD4BF" />
      <stop offset="1" stop-color="#1E88E5" />
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="7" fill="#0B1F3A" />

  <!-- The R's stem doubles as the chart baseline; the bowl and leg are drawn
       as strokes so the mark stays legible at 16px. -->
  <path d="M10 23V9h6.2a4.1 4.1 0 0 1 0 8.2H10"
        fill="none" stroke="url(#roivoMark)" stroke-width="2.6"
        stroke-linecap="round" stroke-linejoin="round" />
  <path d="M15.4 17.2 20 23"
        fill="none" stroke="url(#roivoMark)" stroke-width="2.6"
        stroke-linecap="round" />

  <!-- Rising ticks: the "intelligence" half of the mark. -->
  <path d="M22.5 20.5v-3M26 20.5v-6.5"
        fill="none" stroke="#2DD4BF" stroke-width="2.2" stroke-linecap="round" />
</svg>
