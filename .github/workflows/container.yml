name: Container

on:
  pull_request:
    branches: [main, stage]

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Build only — nothing is pushed anywhere. This proves the image still
      # restores, builds and publishes before Render attempts the same build,
      # and that the Dockerfile COPYs only files that are actually committed
      # (gitignored files are absent from the build context here, exactly as
      # they are on Render).
      - name: Build image
        run: docker build -t roivo:ci .
